# Secrets jtec-mcp reads. Each service's secret is optional: tools for a
# service without its secret are simply not registered.
#
# Values are looked up by key name in the provider given by
# SECRETSPEC_PROVIDER (e.g. bws://<project-uuid>). A value may be a plain
# string (the API key) or a JSON object; config.toml says which field holds
# the key. Point JTEC_MCP_SECRETSPEC at your own copy to rename keys.

[project]
name = "jtec-mcp"
revision = "1.0"

[profiles.default]
SLSKD = { description = "slskd API key, or JSON containing it", ref = { item = "slskd" }, required = false }
AURRAL = { description = "Aurral API key, or JSON containing it", ref = { item = "aurral-api" }, required = false }
SONARR = { description = "Sonarr API key", ref = { item = "sonarr-api" }, required = false }
RADARR = { description = "Radarr API key", ref = { item = "radarr-api" }, required = false }
LIDARR = { description = "Lidarr API key", ref = { item = "lidarr-api" }, required = false }
PROWLARR = { description = "Prowlarr API key", ref = { item = "prowlarr-api" }, required = false }
WHISPARR = { description = "Whisparr API key", ref = { item = "whisparr-api" }, required = false }
CHAPTARR = { description = "Chaptarr API key", ref = { item = "chaptarr-api" }, required = false }
QBITTORRENT = { description = "qBittorrent WebAPI key", ref = { item = "qbittorrent-api-key" }, required = false }
JELLYFIN = { description = "Jellyfin API key, or JSON containing it", ref = { item = "jellyfin" }, required = false }
BAZARR = { description = "Bazarr API key", ref = { item = "bazarr-api" }, required = false }
OPNSENSE = { description = "OPNsense API key and secret: JSON {key, secret}, key:secret, or apikey.txt", ref = { item = "opnsense-api" }, required = false }
